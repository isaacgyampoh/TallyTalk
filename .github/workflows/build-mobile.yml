name: Build mobile apps

# Builds the app in the cloud so you don't need Android Studio / Xcode locally.
# Run it from the "Actions" tab (Run workflow) or on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/gradle.log').read()[-6000:] if os.path.exists('/tmp/gradle.log') else '(no log)'
          data = json.dumps({'title': 'CI diag: gradle assembleDebug', 'body': '```\n' + log + '\n```'}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues", data=data,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'User-Agent': 'ci'})
          print('issue:', urllib.request.urlopen(req).status)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tallytalk-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-compile-check:
    name: iOS compile check (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Copy web assets to iOS
        run: npx cap copy ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Compile (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
