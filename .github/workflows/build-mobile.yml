name: Build mobile apps

# Builds the app in the cloud so you don't need Android Studio / Xcode locally.
# Run it from the "Actions" tab (Run workflow) or on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Add Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
          else
            echo "No GOOGLE_SERVICES_JSON secret set — building without Firebase."
          fi

      # package.json is the single source of the version number (see
      # vite.config.ts, which injects the same value into the web app).
      - name: Read app version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The upload key lives in repository secrets, never in the tree. With it,
      # CI produces the artifacts Play accepts; without it, it builds a debug
      # APK and says so, rather than passing one off as a release.
      - name: Decode the upload keystore
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/upload.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Upload keystore written ($(wc -c < android/keystore/upload.jks) bytes)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — falling back to a debug build."
          fi

      - name: Build signed release APK + bundle
        if: steps.key.outputs.signed == 'true'
        env:
          TT_KEYSTORE_FILE: keystore/upload.jks
          TT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -Pvcode=${{ github.run_number }} -Pvname=${{ steps.ver.outputs.v }}

      # Proof, in the log, of which key signed the artifact — the whole point of
      # this job. A debug-signed "release" is what PB-030 existed to stop.
      - name: Verify the signature
        if: steps.key.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs --verbose "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::The release APK is signed with a debug key."
            exit 1
          fi

      - name: Build debug APK (no upload key configured)
        if: steps.key.outputs.signed != 'true'
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pvcode=${{ github.run_number }} -Pvname=${{ steps.ver.outputs.v }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tallytalk-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/keystore/upload.jks

      - name: Publish the APK to a shareable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk TaskTally.apk
            NOTES="Signed with the upload key. If you installed an earlier debug build, uninstall it first — the signatures differ, so Android will refuse the upgrade."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk TaskTally.apk
            NOTES="Debug build, signed with the shared debug key — for testing only, not a store release. On Android: open the file and allow install from unknown sources."
          fi
          gh release create android-latest \
            --title "TaskTally — latest Android build" \
            --notes "$NOTES" \
            --prerelease 2>/dev/null || true
          gh release edit android-latest --notes "$NOTES"
          gh release delete-asset android-latest TallyTalk.apk -y 2>/dev/null || true
          gh release delete-asset android-latest tallytalk.apk -y 2>/dev/null || true
          gh release upload android-latest TaskTally.apk --clobber

  ios-compile-check:
    name: iOS compile check (no signing)
    runs-on: macos-latest
    # Non-blocking: a runnable iOS build needs Apple signing (your Developer
    # account). This job just flags iOS build breakages; it never blocks the APK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Compile (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
