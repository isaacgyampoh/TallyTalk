name: Build mobile apps

# Builds the app in the cloud so you don't need Android Studio / Xcode locally.
# Run it from the "Actions" tab (Run workflow) or on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pvcode=${{ github.run_number }} -Pvname=1.0.${{ github.run_number }}

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tallytalk-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a shareable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TaskTally.apk
          gh release create android-latest \
            --title "TallyTalk — latest Android build" \
            --notes "Debug build for testing. On Android: open the file and allow install from unknown sources." \
            --prerelease 2>/dev/null || true
          gh release delete-asset android-latest TallyTalk.apk -y 2>/dev/null || true
          gh release delete-asset android-latest tallytalk.apk -y 2>/dev/null || true
          gh release upload android-latest TaskTally.apk --clobber

  ios-compile-check:
    name: iOS compile check (no signing)
    runs-on: macos-latest
    # Non-blocking: a runnable iOS build needs Apple signing (your Developer
    # account). This job just flags iOS build breakages; it never blocks the APK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Compile (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
