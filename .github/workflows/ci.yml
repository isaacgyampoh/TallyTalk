name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # End-to-end runs against the production build the step above produced.
      # Chromium and WebKit only: between them they cover the two engines this
      # product actually ships on, and installing more costs CI minutes for
      # little return.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
