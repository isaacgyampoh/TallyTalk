name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

      # The migrations, applied to a real PostgreSQL, with the policies and
      # triggers exercised as the roles the app connects as. The runner builds
      # its own throwaway cluster; the image's server binaries are not on PATH
      # by default, so point at them.
      - name: Database tests
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          export PATH="$PGBIN:$PATH"
          npm run test:db

      - run: npm run build

      # End-to-end runs against the production build the step above produced.
      # Chromium and WebKit only: between them they cover the two engines this
      # product actually ships on, and installing more costs CI minutes for
      # little return.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
